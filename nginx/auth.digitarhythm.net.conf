## auth.digitarhythm.net — トークンサイレントリフレッシュサービス（汎用認証プロキシ）
## Leaf から分離した独立サブドメイン。認証API のみを公開する。
##   /api/*   → Node.js バックエンド (port 3000)
##   それ以外 → 404（静的サイトは配信しない）
##
## 注意: この HTTPS ブロックは証明書 /etc/letsencrypt/live/auth.digitarhythm.net/ が
##       発行済みであることが前提。初回は certbot(webroot) で取得してから reload すること。

# HTTP → HTTPS リダイレクト
server {
    listen 80;
    server_name auth.digitarhythm.net;

    # Let's Encrypt webroot 認証用（証明書取得・更新のため）
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt-challenge;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # このファイルは conf.d 内でアルファベット順の先頭に読み込まれるため、
    # 共有ソケット(0.0.0.0:443)の http2 はここで定義する（他 vhost は listen 443 ssl のみ）。
    listen 443 ssl http2;
    server_name auth.digitarhythm.net;

    # Let's Encrypt SSL 証明書（auth 専用）
    ssl_certificate     /etc/letsencrypt/live/auth.digitarhythm.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.digitarhythm.net/privkey.pem;

    # ─────────────────────────────────────────────
    # 認証API プロキシ → Node.js バックエンド (PM2, Leaf と共用の port 3000)
    #   ※ バックエンドは app_id/共有キーでアプリを識別するマルチテナント方式
    # ─────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # 認証API 以外はサービスの実体を隠すため 404
    location / {
        return 404;
    }
}
